<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>霓虹贪吃蛇</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="hero-copy">
        <p class="eyebrow">Retro Arcade / Local Play</p>
        <h1>霓虹贪吃蛇</h1>
        <p class="lead">
          用方向键或 WASD 驾驶蛇群穿过电子网格，冲击更高分数。
        </p>

        <div class="scoreboard" aria-label="分数信息">
          <article class="score-card">
            <span class="score-label">当前分数</span>
            <strong id="score">0</strong>
          </article>
          <article class="score-card accent">
            <span class="score-label">最高分</span>
            <strong id="high-score">0</strong>
          </article>
        </div>

        <div class="controls" aria-label="游戏控制">
          <button id="toggle-button" class="game-button primary" type="button">
            开始游戏
          </button>
          <button id="restart-button" class="game-button ghost" type="button">
            重新开始
          </button>
        </div>

        <ul class="tips" aria-label="操作提示">
          <li>方向键 / WASD 控制移动</li>
          <li>空格键可快速暂停或继续</li>
          <li>每吃 5 个食物速度会提升</li>
        </ul>
      </section>

      <section class="board-panel" aria-label="游戏区域">
        <div class="board-frame">
          <canvas
            id="game-canvas"
            width="520"
            height="520"
            aria-label="贪吃蛇游戏画布"
          ></canvas>
          <div class="status-strip">
            <span id="status-text">点击“开始游戏”进入棋盘</span>
          </div>
        </div>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
