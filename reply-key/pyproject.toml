[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "replykey-desktop"
version = "0.1.0"
description = "A safe, manual-send-only AI reply draft helper for desktop WeChat on Windows."
requires-python = ">=3.11,<3.12"
dependencies = [
  "PySide6>=6.7,<7",
  "openai>=1.54,<3",
  "keyring>=25,<27",
]

[project.scripts]
replykey = "replykey.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

